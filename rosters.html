  <style>
   :root{--bg-dark:#07090e;--sidebar-bg:#04060a;--card-bg:#0f1520;--card-inner:#141c2c;--border-color:#1a2638;--accent-cyan:#00f0ff;--accent-cyan-hover:#00cce0;--accent-glow:rgba(0,240,255,.15);--text-white:#fff;--text-muted:#808e9b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-dark);color:var(--text-white);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh}
aside{display:none}
main{margin-left:0;flex:1;padding:30px 40px 80px;max-width:1400px;margin-right:auto}
.back-button{display:inline-flex;align-items:center;gap:8px;margin-bottom:24px;background:var(--card-bg);border:1px solid var(--border-color);color:var(--text-white);padding:10px 16px;border-radius:6px;text-decoration:none;font-size:.75rem;font-weight:900;letter-spacing:.6px;text-transform:uppercase;transition:.2s}
.back-button:hover{border-color:var(--accent-cyan);color:var(--accent-cyan);background:var(--accent-glow)}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.section-title{font-size:.9rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)}
.section-title span{color:var(--accent-cyan)}
.pack-count{font-size:.75rem;font-weight:800;color:var(--text-muted)}
.controls-bar{display:flex;gap:12px;margin-bottom:24px}
.search-input{flex:1;background:var(--card-bg);border:1px solid var(--border-color);border-radius:6px;padding:10px 16px;color:var(--text-white);font-size:.8rem;outline:none}
.search-input:focus{border-color:var(--accent-cyan)}
.cf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-bottom:50px}
.cf-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;position:relative;transition:border-color .2s,transform .2s}
.cf-card:hover{border-color:var(--accent-cyan);transform:translateY(-2px)}
.card-preview{width:100%;height:160px;background:radial-gradient(circle,#141c2c 0%,#05070a 100%);position:relative;display:flex;align-items:center;justify-content:center;color:var(--accent-cyan);font-weight:900;font-size:1.1rem;letter-spacing:1px}
.badge-tag{position:absolute;top:10px;left:10px;background:var(--accent-cyan);color:#000;font-size:.65rem;font-weight:900;padding:2px 6px;border-radius:4px;letter-spacing:.5px;z-index:10}
.card-body{padding:16px;display:flex;flex-direction:column;gap:6px}
.player-name{font-size:.95rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.tags-row{display:flex;gap:8px;font-size:.7rem;color:var(--text-muted);margin-bottom:10px}
.btn-group{display:flex;gap:8px}
.btn-download{flex:1;background:var(--accent-cyan);color:#000;border:0;border-radius:4px;padding:10px;font-size:.75rem;font-weight:900;text-transform:uppercase;text-decoration:none;text-align:center;cursor:pointer;transition:.2s}
.btn-download:hover{background:var(--accent-cyan-hover)}
.floating-support{position:fixed;bottom:24px;right:24px;background:var(--accent-cyan);color:#000;border:0;border-radius:30px;padding:10px 18px;font-weight:900;font-size:.8rem;display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 4px 20px rgba(0,240,255,.3);text-decoration:none;z-index:999}
@media(max-width:768px){main{padding:20px}}
  </style>
  <style id="ray2k-folder-overrides">
   .folder-side{position:fixed;left:0;top:0;width:220px;height:100vh;background:#04060a;border-right:1px solid #1a2638;padding:24px 14px;display:flex;flex-direction:column;justify-content:space-between;z-index:9998}
.folder-side .folder-brand{display:block;font-size:24px;font-weight:950;letter-spacing:1px;text-decoration:none;color:#fff}.folder-side .folder-brand span{color:#00f0ff}
.folder-side .folder-sub{display:block;color:#00f0ff;font-size:10px;font-weight:900;letter-spacing:1px;margin-top:3px}
.folder-current{margin-top:28px;padding:12px;border-left:3px solid #00f0ff;background:rgba(0,240,255,.12);border-radius:6px;color:#00f0ff;font-size:11px;font-weight:900;letter-spacing:.7px}
.folder-bottom{display:flex;flex-direction:column;gap:8px}.folder-clock{border-top:1px solid #1a2638;padding-top:11px;color:#718094;font-size:9px;line-height:1.5}.folder-clock strong{color:#00f0ff;font-size:11px}.folder-btn{display:block;width:100%;padding:9px 10px;background:#0f1520;border:1px solid #1a2638;border-radius:5px;color:#fff;font-size:10px;font-weight:900;text-align:center;text-decoration:none;text-transform:uppercase;cursor:pointer}.folder-btn:hover{border-color:#00f0ff;color:#00f0ff}.folder-support{position:fixed;right:22px;bottom:22px;z-index:9999;background:#00f0ff;color:#000;border-radius:30px;padding:10px 16px;font-size:11px;font-weight:950;text-decoration:none;box-shadow:0 4px 20px rgba(0,240,255,.28)}

  <script id="ray2k-folder-tools">
   (function(){
const key='ray2kFolderTheme';const modes=['CYAN','RED','BLACK','LIGHT'];let i=Math.max(0,modes.indexOf(localStorage.getItem(key)||'CYAN'));const root=document.documentElement,body=document.body;
function apply(){const m=modes[i];let accent='#00f0ff',bg='#07090e',side='#04060a',card='#0f1520',line='#1a2638',text='#fff',muted='#808e9b';if(m==='RED'){accent='#ff3030';bg='#090608';line='#3a1b23'}if(m==='BLACK'){accent='#fff';bg='#000';side='#000';card='#080808';line='#222';muted='#777'}if(m==='LIGHT'){accent='#087cff';bg='#eef2f6';side='#fff';card='#fff';line='#d8dee8';text='#111827';muted='#687386'}root.style.setProperty('--accent-cyan',accent);root.style.setProperty('--bg-dark',bg);root.style.setProperty('--sidebar-bg',side);root.style.setProperty('--card-bg',card);root.style.setProperty('--border-color',line);root.style.setProperty('--text-white',text);root.style.setProperty('--text-muted',muted);const b=document.getElementById('folderThemeBtn');if(b)b.textContent='THEME: '+m;localStorage.setItem(key,m)}
function cycle(){i=(i+1)%modes.length;apply()}const b=document.getElementById('folderThemeBtn');if(b)b.addEventListener('click',cycle);
function clock(){const d=new Date();const t=document.getElementById('folderTime'),dt=document.getElementById('folderDate');if(t)t.textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});if(dt)dt.textContent=d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric',year:'numeric'})}clock();setInterval(clock,1000);apply();
})();
