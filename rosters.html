<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rosters — RAY2K</title>

<style>

:root {
  --bg:#07090e;
  --sidebar:#04060a;
  --card:#0f1520;
  --border:#1a2638;
  --accent:#00f0ff;
  --accent-hover:#00cce0;
  --glow:rgba(0,240,255,.14);
  --text:#fff;
  --muted:#8290a0;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,system-ui,sans-serif;
}

aside {
  position:fixed;
  left:0;
  top:0;

  width:240px;
  height:100vh;

  padding:28px 16px;

  background:var(--sidebar);
  border-right:1px solid var(--border);

  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.brand {
  display:flex;
  flex-direction:column;
  gap:4px;
}

.logo {
  color:var(--text);
  text-decoration:none;
  font-size:1.55rem;
  font-weight:950;
}

.logo span,
.sub {
  color:var(--accent);
}

.sub {
  font-size:.65rem;
  font-weight:900;
  letter-spacing:1px;
}

.current {
  margin-top:30px;

  display:block;

  padding:13px 14px;

  border-left:3px solid var(--accent);
  border-radius:6px;

  background:var(--glow);

  color:var(--accent);

  font-size:.75rem;
  font-weight:900;
}

.bottom {
  display:flex;
  flex-direction:column;
  gap:9px;
}

.clock {
  border-top:1px solid var(--border);
  padding-top:14px;
}

#clock {
  color:var(--accent);
  font-size:.78rem;
  font-weight:950;
}

#date {
  color:var(--muted);
  font-size:.62rem;
  margin-top:3px;
}

button,
.back,
.community {
  display:block;
  width:100%;

  padding:10px 12px;

  border:1px solid var(--border);
  border-radius:6px;

  background:var(--card);
  color:var(--text);

  font-size:.65rem;
  font-weight:900;

  text-align:center;
  text-decoration:none;
  text-transform:uppercase;

  cursor:pointer;
}

button:hover,
.back:hover,
.community:hover {
  color:var(--accent);
  border-color:var(--accent);
}

main {
  margin-left:240px;
  min-height:100vh;

  padding:55px 45px 80px;
}

.container {
  max-width:1100px;
  margin:auto;
}

.kicker {
  color:var(--accent);
  font-size:.65rem;
  font-weight:950;
  letter-spacing:2px;
}

h1 {
  margin-top:10px;
  font-size:clamp(2rem,5vw,4rem);
  font-weight:950;
  text-transform:uppercase;
}

.description {
  margin-top:12px;
  max-width:650px;

  color:var(--muted);
  font-size:.75rem;
  line-height:1.7;
}

.roster-box {
  margin-top:35px;

  padding:28px;

  background:var(--card);
  border:1px solid var(--border);
  border-radius:8px;
}

.roster-box h2 {
  font-size:1rem;
  text-transform:uppercase;
}

.roster-box p {
  margin-top:10px;

  color:var(--muted);
  font-size:.7rem;
  line-height:1.7;
}

.download {
  display:inline-block;

  margin-top:22px;

  padding:11px 18px;

  background:var(--accent);
  color:#000;

  border-radius:5px;

  text-decoration:none;

  font-size:.68rem;
  font-weight:950;
  text-transform:uppercase;
}

.download:hover {
  background:var(--accent-hover);
}

@media(max-width:800px) {

  aside {
    position:relative;
    width:100%;
    height:auto;

    border-right:none;
    border-bottom:1px solid var(--border);
  }

  main {
    margin-left:0;
    padding:35px 20px 60px;
  }

}

</style>
</head>

<body>

<aside>

  <div>

    <div class="brand">

      <a href="index.html" class="logo">
        RAY<span>2K</span>
      </a>

      <span class="sub">
        NBA 2K14 LAB
      </span>

    </div>

    <div class="current">
      ROSTERS
    </div>

  </div>

  <div class="bottom">

    <div class="clock">
      <div id="clock">00:00:00</div>
      <div id="date">Loading...</div>
    </div>

    <button onclick="changeTheme()">
      THEME: CYAN
    </button>

    <a
      href="https://www.facebook.com/profile.php?id=61594111973222"
      target="_blank"
      rel="noopener noreferrer"
      class="community"
    >
      JOIN COMMUNITY
    </a>

    <a href="index.html" class="back">
      BACK TO RAY2K
    </a>

  </div>

</aside>

<main>

  <div class="container">

    <div class="kicker">
      NBA 2K14 ARCHIVE
    </div>

    <h1>
      ROSTERS
    </h1>

    <p class="description">
      Browse the RAY2K NBA 2K14 roster archive.
    </p>

    <div class="roster-box">

      <h2>
        RAY2K NBA 2K14 ROSTER
      </h2>

      <p>
        Roster downloads and updates will be listed here.
      </p>

      <a href="#" class="download">
        DOWNLOAD
      </a>

    </div>

  </div>

</main>

<script>

function updateClock() {

  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], {
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString([], {
      weekday:"short",
      month:"short",
      day:"numeric",
      year:"numeric"
    });
}

updateClock();
setInterval(updateClock,1000);


const themes = [
  ["CYAN","#00f0ff","#00cce0","rgba(0,240,255,.14)"],
  ["RED","#ff3030","#df2020","rgba(255,48,48,.14)"],
  ["LIGHT","#087cff","#0666d6","rgba(8,124,255,.12)"],
  ["BLACK","#fff","#d9d9d9","rgba(255,255,255,.08)"]
];

let themeIndex =
  Number(localStorage.getItem("ray2kTheme") || 0);

function applyTheme() {

  const t = themes[themeIndex];

  document.documentElement.style.setProperty("--accent",t[1]);
  document.documentElement.style.setProperty("--accent-hover",t[2]);
  document.documentElement.style.setProperty("--glow",t[3]);

  if(t[0] === "LIGHT") {

    document.documentElement.style.setProperty("--bg","#eef1f5");
    document.documentElement.style.setProperty("--sidebar","#fff");
    document.documentElement.style.setProperty("--card","#fff");
    document.documentElement.style.setProperty("--border","#d8dee8");
    document.documentElement.style.setProperty("--text","#111827");
    document.documentElement.style.setProperty("--muted","#687386");

  } else if(t[0] === "BLACK") {

    document.documentElement.style.setProperty("--bg","#000");
    document.documentElement.style.setProperty("--sidebar","#000");
    document.documentElement.style.setProperty("--card","#080808");
    document.documentElement.style.setProperty("--border","#202020");
    document.documentElement.style.setProperty("--text","#fff");
    document.documentElement.style.setProperty("--muted","#777");

  } else {

    document.documentElement.style.setProperty("--bg","#07090e");
    document.documentElement.style.setProperty("--sidebar","#04060a");
    document.documentElement.style.setProperty("--card","#0f1520");
    document.documentElement.style.setProperty("--border","#1a2638");
    document.documentElement.style.setProperty("--text","#fff");
    document.documentElement.style.setProperty("--muted","#8290a0");

  }

  document.querySelector("button").textContent =
    "THEME: " + t[0];
}

function changeTheme() {

  themeIndex++;

  if(themeIndex >= themes.length)
    themeIndex = 0;

  localStorage.setItem("ray2kTheme",themeIndex);

  applyTheme();
}

applyTheme();

</script>

</body>
</html>
