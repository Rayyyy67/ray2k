<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roster Updates — RAY2K</title>
  <style>
    :root {
      --bg-dark:#07090e; --card-bg:#0f1520; --card-inner:#141c2c;
      --border-color:#1a2638; --accent-cyan:#00f0ff;
      --accent-cyan-hover:#00cce0; --accent-glow:rgba(0,240,255,.15);
      --text-white:#fff; --text-muted:#808e9b;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg-dark);color:var(--text-white);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh}
    main{width:100%;padding:30px 40px 80px;max-width:1400px;margin:0 auto}
    .top-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:38px}
    .back-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--border-color);border-radius:6px;background:var(--card-bg);color:var(--text-white);text-decoration:none;font-size:.75rem;font-weight:900;letter-spacing:.7px;text-transform:uppercase;transition:.2s}
    .back-btn:hover{border-color:var(--accent-cyan);color:var(--accent-cyan);background:var(--accent-glow);box-shadow:0 0 20px rgba(0,240,255,.12)}
    .page-brand{font-size:.8rem;font-weight:900;letter-spacing:1px;color:var(--text-muted)}
    .page-brand span{color:var(--accent-cyan)}
    .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .section-title{font-size:.9rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)}
    .section-title span{color:var(--accent-cyan)}
    .pack-count{font-size:.75rem;font-weight:800;color:var(--text-muted)}
    .controls-bar{display:flex;gap:12px;margin-bottom:24px}
    .search-input{flex:1;background:var(--card-bg);border:1px solid var(--border-color);border-radius:6px;padding:10px 16px;color:var(--text-white);font-size:.8rem;outline:none}
    .search-input:focus{border-color:var(--accent-cyan);box-shadow:0 0 15px rgba(0,240,255,.08)}
    .cf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-bottom:50px}
    .cf-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;position:relative;transition:border-color .2s,transform .2s,box-shadow .2s}
    .cf-card:hover{border-color:var(--accent-cyan);transform:translateY(-2px);box-shadow:0 0 24px rgba(0,240,255,.1)}
    .card-preview{width:100%;height:160px;background:radial-gradient(circle,#141c2c 0%,#05070a 100%);position:relative;display:flex;align-items:center;justify-content:center;color:var(--accent-cyan);font-weight:900;font-size:1.1rem;letter-spacing:1px}
    .badge-tag{position:absolute;top:10px;left:10px;background:var(--accent-cyan);color:#000;font-size:.65rem;font-weight:900;padding:2px 6px;border-radius:4px;letter-spacing:.5px;z-index:10}
    .card-body{padding:16px;display:flex;flex-direction:column;gap:6px}
    .player-name{font-size:.95rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
    .tags-row{display:flex;gap:8px;font-size:.7rem;color:var(--text-muted);margin-bottom:10px}
    .btn-group{display:flex;gap:8px}
    .btn-download{flex:1;background:var(--accent-cyan);color:#000;border:none;border-radius:4px;padding:10px;font-size:.75rem;font-weight:900;text-transform:uppercase;text-decoration:none;text-align:center;cursor:pointer;transition:.2s}
    .btn-download:hover{background:var(--accent-cyan-hover);box-shadow:0 0 18px rgba(0,240,255,.22)}
    .floating-support{position:fixed;bottom:24px;right:24px;background:var(--accent-cyan);color:#000;border-radius:30px;padding:10px 18px;font-weight:900;font-size:.8rem;text-decoration:none;box-shadow:0 4px 20px rgba(0,240,255,.3);z-index:999}
    @media(max-width:768px){main{padding:20px 16px 70px}.top-nav{margin-bottom:25px}.cf-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <div class="top-nav">
    <a href="index.html" class="back-btn">← BACK TO RAY2K</a>
    <div class="page-brand">RAY<span>2K</span> // NBA 2K14</div>
  </div>

  <div class="section-header">
    <div class="section-title">ROSTER <span>UPDATES</span></div>
    <div class="pack-count">1 PACK</div>
  </div>

  <div class="controls-bar">
    <input type="text" id="rosterSearch" class="search-input" placeholder="Search roster updates...">
  </div>

  <div class="cf-grid" id="rosterGrid">
    <div class="cf-card" data-name="ROSTER 26-27">
      <div class="card-preview"><span class="badge-tag">LATEST</span>RAY2K ROSTER</div>
      <div class="card-body">
        <div class="player-name">ROSTER 26-27</div>
        <div class="tags-row"><span>Official Update</span> • <span>.ROS</span></div>
        <div class="btn-group">
          <a href="https://www.mediafire.com/file/5vevgosdiqzp7rv/Roster+26-27.zip/file" target="_blank" class="btn-download">DOWNLOAD</a>
        </div>
      </div>
    </div>
  </div>
</main>

<a href="#" class="floating-support">⚡ SUPPORT</a>
<script>
document.getElementById('rosterSearch').addEventListener('input',function(e){
  const q=e.target.value.toLowerCase();
  document.querySelectorAll('#rosterGrid .cf-card').forEach(card=>{
    card.style.display=card.getAttribute('data-name').toLowerCase().includes(q)?'flex':'none';
  });
});
</script>
</body>
</html>
