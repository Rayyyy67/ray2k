<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roster Updates — RAY2K</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --sidebar-bg: #04060a;
      --card-bg: #0f1520;
      --card-inner: #141c2c;
      --border-color: #1a2638;
      --accent-cyan: #00f0ff;
      --accent-cyan-hover: #00cce0;
      --accent-glow: rgba(0, 240, 255, 0.15);
      --text-white: #ffffff;
      --text-muted: #808e9b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      min-height: 100vh;
    }

    /* Left Sidebar */
    aside {
      width: 240px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 16px;
      position: fixed;
      height: 100vh;
      z-index: 100;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--text-white);
      text-decoration: none;
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--accent-cyan);
    }

    .sub-title {
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--accent-cyan);
      letter-spacing: 1px;
    }

    .nav-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-menu a {
      display: block;
      padding: 10px 12px;
      border-radius: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 800;
      font-size: 0.75rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .nav-menu a.active,
    .nav-menu a:hover {
      background: var(--accent-glow);
      color: var(--accent-cyan);
    }

    .sidebar-footer {
      font-size: 0.7rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    /* Main Area */
    main {
      margin-left: 240px;
      flex: 1;
      padding: 30px 40px 80px;
      max-width: 1400px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .section-title span {
      color: var(--accent-cyan);
    }

    .pack-count {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .search-input {
      flex: 1;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 16px;
      color: var(--text-white);
      font-size: 0.8rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-cyan);
    }

    /* Grid Layout */
    .cf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }

    /* Roster Card */
    .cf-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: border-color 0.2s, transform 0.2s;
    }

    .cf-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
    }

    .card-preview {
      width: 100%;
      height: 160px;
      background: radial-gradient(circle, #141c2c 0%, #05070a 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .badge-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: var(--accent-cyan);
      color: #000000;
      font-size: 0.65rem;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      z-index: 10;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .player-name {
      font-size: 0.95rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tags-row {
      display: flex;
      gap: 8px;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-download {
      flex: 1;
      background-color: var(--accent-cyan);
      color: #000000;
      border: none;
      border-radius: 4px;
      padding: 10px;
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-download:hover {
      background-color: var(--accent-cyan-hover);
    }

    /* Floating Support Button */
    .floating-support {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: var(--accent-cyan);
      color: #000000;
      border: none;
      border-radius: 30px;
      padding: 10px 18px;
      font-weight: 900;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.3);
      text-decoration: none;
      z-index: 999;
    }

    @media (max-width: 768px) {
      aside { display: none; }
      main { margin-left: 0; padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- Left Sidebar Navigation -->
  <aside>
    <div>
      <div class="brand">
        <a href="index.html" class="logo">RAY<span>2K</span></a>
        <span class="sub-title">NBA 2K14 LAB</span>
      </div>

      <ul class="nav-menu">
        <li><a href="index.html">RAY2K LAB</a></li>
        <li><a href="rosters.html" class="active">ROSTER UPDATES</a></li>
        <li><a href="cyberfaces.html">CYBERFACES</a></li>
        <li><a href="#">INSTALLATION</a></li>
        <li><a href="#">DEDICATED MODS</a></li>
        <li><a href="file-ids.html">FILE IDS</a></li>
      </ul>
    </div>

    <div class="sidebar-footer">
      <p>Facebook</p>
      <p style="margin-top: 4px; color: var(--text-muted);">PC / Windows only</p>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main>

    <!-- ROSTER UPDATES SECTION -->
    <div class="section-header">
      <div class="section-title">ROSTER <span>UPDATES</span></div>
      <div class="pack-count">1 PACK</div>
    </div>

    <div class="controls-bar">
      <input type="text" id="rosterSearch" class="search-input" placeholder="Search roster updates...">
    </div>

    <div class="cf-grid" id="rosterGrid">

      <!-- Card: Roster 26-27 -->
      <div class="cf-card" data-name="ROSTER 26-27">
        <div class="card-preview">
          <span class="badge-tag">LATEST</span>
          RAY2K ROSTER
        </div>
        <div class="card-body">
          <div class="player-name">ROSTER 26-27</div>
          <div class="tags-row">
            <span>Official Update</span> • <span>.ROS</span>
          </div>
          <div class="btn-group">
            <a href="https://www.mediafire.com/file/5vevgosdiqzp7rv/Roster+26-27.zip/file" target="_blank" class="btn-download">DOWNLOAD</a>
          </div>
        </div>
      </div>

    </div>

  </main>

  <!-- Floating Support Button -->
  <a href="#" class="floating-support">
    ⚡ SUPPORT
  </a>

  <!-- Interactive Search Script -->
  <script>
    document.getElementById('rosterSearch').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase();
      const cards = document.querySelectorAll('#rosterGrid .cf-card');
      cards.forEach(card => {
        const name = card.getAttribute('data-name').toLowerCase();
        card.style.display = name.includes(query) ? 'flex' : 'none';
      });
    });
  </script>

</body>
</html>
